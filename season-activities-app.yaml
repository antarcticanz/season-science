name: ebr-app
description: Evolving Biogeography Register (EBR) Dashboard (Dash + Plotly)
resources:

  # 1. Source repository
  # --------------------
  sources:
    - name: ebr-app-source
      description: Source Code
      userSecretRef:
        name: "antnz-app-deployment"
        key: "key"
      github:
        repository: "antarcticanz/ecological-biogeography-register-dashboard"
        username: "antnz-app-deployment"

  # 2. Build image
  # --------------
  builds:
    - name: ebr-app-build
      resources:
        storage: 10G
      sourceRef:
        name: ebr-app-source
        branch: main
      # Use a stable Python base image for Dash deployments
      baseImage: python:3.11-slim
      buildCommand: "pip install --no-cache-dir -r requirements.txt"

  # 3. Service definition
  # ---------------------
  services:
    - name: ebr-app
      description: EBR Dashboard service
      autoscale:
        minReplicas: 1
        # maxReplicas: 5
      resources:
        cpu: 500m
        memory: 2.5G

      # The platform expects the container to listen on port 80.
      # We run Gunicorn bound to 0.0.0.0:80 and expose /health for monitoring.
      healthCheck:
        path: /health
        port: 80

      image:
        buildRef: ebr-app-build

      # Production command (WSGI)
      command: gunicorn app:server --bind 0.0.0.0:80 --workers 2 --timeout 120

  # 4. Deployment stages
  # --------------------
  stages:
    - name: prod
      resources:
        services:
          - name: ebr-app
