name: season-activities
description: Antarctica New Zealand Science Activities
resources:

  # 1. Source repository
  # --------------------
  sources:
    - name: season-activities-source
      description: Source Code
      userSecretRef:
        name: "antnz-app-deployment"
        key: "key"
      github:
        repository: "antarcticanz/antarcticanz/season-science"
        username: "antnz-app-deployment"

  # 2. Build image
  # --------------
  builds:
    - name: season-activities-build
      resources:
        storage: 10G
      sourceRef:
        name: season-activities-source
        branch: main
      # Use a stable Python base image for Dash deployments
      baseImage: python:3.11-slim
      buildCommand: "pip install --no-cache-dir -r requirements.txt"

  # 3. Service definition
  # ---------------------
  services:
    - name: season-activities
      description: season-activities Dashboard service
      autoscale:
        minReplicas: 1
        # maxReplicas: 5
      resources:
        cpu: 500m
        memory: 2.5G

      # The platform expects the container to listen on port 80.
      # We run Gunicorn bound to 0.0.0.0:80 and expose /health for monitoring.
      healthCheck:
        path: /health
        port: 80

      image:
        buildRef: season-activities-build

      # Production command (WSGI)
      command: gunicorn app:server --bind 0.0.0.0:80 --workers 2 --timeout 120

  # 4. Deployment stages
  # --------------------
  stages:
    - name: prod
      resources:
        services:
          - name: season-activities
